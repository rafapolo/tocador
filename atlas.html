  <meta name="twitter:image" content="https://tocador.cc/assets/atlas-og.jpg">
  <meta name="twitter:image:alt" content="Nuvem de pontos coloridos por gênero musical sobre fundo escuro, com o título Atlas">
  <meta name="theme-color" content="#0f0e0c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect fill='%231a1814' width='200' height='200'/%3E%3Ccircle cx='100' cy='100' r='40' fill='none' stroke='%23d4a574' stroke-width='8'/%3E%3Ccircle cx='100' cy='100' r='15' fill='none' stroke='%23d4a574' stroke-width='2'/%3E%3C/svg%3E">

  <script src="js/acervo-format.js" defer></script>
  <script src="js/util.js" defer></script>
  <script src="js/atlas-data.js" defer></script>
  <script src="js/atlas-grafo.js" defer></script>
  <script src="js/acervo-features.js" defer></script>
  <script src="js/som-abas.js" defer></script>
  <script src="js/atlas-receitas.js" defer></script>

</head>
<body>
<svg hidden aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-som" viewBox="0 0 24 24"><path d="M3 12h1.5M7 8v8M11 4v16M15 8v8M19 10.5v3M21.5 12H21"/></symbol>
  <symbol id="i-genero" viewBox="0 0 24 24"><path d="M12 3h6a2 2 0 0 1 2 2v6a2 2 0 0 1-.6 1.4l-8 8a2 2 0 0 1-2.8 0l-6-6a2 2 0 0 1 0-2.8l8-8A2 2 0 0 1 12 3Z"/><circle cx="16" cy="8" r="1.2"/></symbol>
  <symbol id="i-todos" viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/></symbol>
  <symbol id="i-acervo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 6.5A5.5 5.5 0 0 1 17.5 12"/></symbol>
  <symbol id="i-grafo" viewBox="0 0 24 24"><path d="m12 12-7-6M12 12l7-5M12 12l5 7"/><circle cx="12" cy="12" r="2.6"/><circle cx="5" cy="6" r="1.9"/><circle cx="19" cy="7" r="1.9"/><circle cx="17" cy="19" r="1.9"/></symbol>
  <symbol id="i-girar" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 3.5v4.8h-4.8"/></symbol>
  <symbol id="i-musica" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></symbol>
  <symbol id="i-mais" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-menos" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-inicio" viewBox="0 0 24 24"><path d="m3.5 11 8.5-7 8.5 7"/><path d="M6 9.5V20h12V9.5"/></symbol>
  <symbol id="i-tocar" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5L8 5.5Z"/></symbol>
  <symbol id="i-pausar" viewBox="0 0 24 24"><path d="M9 5.5v13M15 5.5v13"/></symbol>
  <symbol id="i-sobre" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.8"/><circle cx="12" cy="17.2" r="0.4"/></symbol>
  <symbol id="i-artista" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/></symbol>
</svg>
<main id="atlas">
  <canvas id="atlas-canvas" role="img" aria-label="Mapa de todas as faixas: cada ponto é uma faixa, e faixas que soam parecido ficam perto"></canvas>
  <div id="marcos" aria-hidden="true"></div>
  <div id="faixas" aria-hidden="true"></div>
  <div id="anel-hover" class="anel" hidden></div>
  <div id="anel-sel" class="anel anel-sel" hidden></div>
  <div id="dica" role="tooltip" hidden></div>
<section id="grafo" aria-label="Grafo de artistas parecidos" hidden>
  <canvas id="grafo-tudo" aria-hidden="true"></canvas>
  <svg id="grafo-svg" role="group" aria-label="Artistas ligados aos mais parecidos"><g id="grafo-mundo"><g id="grafo-arestas"></g><g id="grafo-nos"></g></g></svg>
  <div id="grafo-painel">
    <button id="grafo-fechar" type="button" aria-label="Fechar o grafo" title="Fechar o grafo (Esc)"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    <p id="grafo-genero" hidden><span class="ponto"></span><span id="grafo-genero-nome"></span></p>
    <h2 id="grafo-titulo"></h2>
    <p id="grafo-detalhe"></p>
    <p id="grafo-album" hidden></p>
    <div id="grafo-capas" hidden></div>
    <div id="grafo-parecidos" hidden><p>Soa parecido com</p><div id="grafo-parecidos-lista"></div></div>
    <a id="grafo-ouvir" class="botao" href="./" hidden>♪ no tocador</a>
  </div>
</section>

  <header id="topo">
    <a id="voltar" href="./" aria-label="Voltar ao Tocador">←<span> Tocador</span></a>
    <h1>Atlas</h1>
    <div id="busca-wrap">
      <input id="busca" type="search" placeholder="Buscar artista, álbum ou faixa" autocomplete="off" spellcheck="false" aria-label="Buscar artista, álbum ou faixa" aria-describedby="contagem" disabled>
      <button id="busca-limpar" type="button" aria-label="Limpar busca" hidden><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <p id="contagem" role="status" aria-live="polite"></p>
    <nav id="controles" aria-label="Opções do mapa">
      <div class="seg" role="group" aria-label="Posição dos pontos">
        <button type="button" data-mapa="som" aria-pressed="true" title="Posição pelo som (embedding de áudio)"><svg class="ic" aria-hidden="true"><use href="#i-som"/></svg>Som</button>
        <button type="button" data-mapa="rotulos" aria-pressed="false" title="Posição pelos rótulos de gênero"><svg class="ic" aria-hidden="true"><use href="#i-genero"/></svg>Gêneros</button>
      </div>
      <div class="seg" role="group" aria-label="Acervo">
        <button type="button" data-acervo="todos" aria-pressed="true"><svg class="ic" aria-hidden="true"><use href="#i-todos"/></svg>Todos</button>
        <button type="button" data-acervo="uqt" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-acervo"/></svg>UQT</button>
        <button type="button" data-acervo="homi" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-acervo"/></svg>Homi</button>
      </div>
      <div class="seg" role="group" aria-label="Visualização">
        <button id="btn-grafo" type="button" aria-pressed="false" title="Ver artistas parecidos como grafo (G)"><svg class="ic" aria-hidden="true"><use href="#i-grafo"/></svg>Grafo</button>
      </div>
      <div class="seg" role="group" aria-label="Som">
        <button id="btn-musica" type="button" aria-pressed="true" aria-label="Sonificar o mapa"><svg class="ic" aria-hidden="true"><use href="#i-musica"/></svg><span>Sonificar</span></button>
      </div>
      <div class="seg" role="group" aria-label="Tour">
        <button id="btn-tour" type="button" aria-pressed="false" title="Tour de 2 minutos pelo mapa e pela sonificação (T)" disabled><svg class="ic" aria-hidden="true"><use href="#i-tocar"/></svg><span>Tour</span></button>
      </div>
      <div class="seg seg-sobre">
        <a id="btn-sobre" href="https://github.com/rafapolo/tocador/blob/main/ATLAS.md" target="_blank" rel="noopener" aria-label="Sobre o Atlas" title="Como o Atlas foi feito"><svg class="ic" aria-hidden="true"><use href="#i-sobre"/></svg><span>Sobre</span></a>
      </div>
    </nav>
  </header>


  <details id="legenda">
    <summary>Gêneros</summary>
    <ul id="legenda-lista"></ul>
  </details>

  <div id="visor-som" aria-hidden="true"><canvas width="280" height="44"></canvas><p></p></div>
  <div id="zoom" role="group" aria-label="Zoom">
    <button id="zoom-girar" type="button" aria-pressed="false" aria-label="Girar em 3D" title="Girar em 3D: arrastar gira a vista" hidden><svg class="ic" aria-hidden="true"><use href="#i-girar"/></svg></button>
    <button id="zoom-mais" type="button" aria-label="Aproximar"><svg class="ic" aria-hidden="true"><use href="#i-mais"/></svg></button>
    <button id="zoom-menos" type="button" aria-label="Afastar"><svg class="ic" aria-hidden="true"><use href="#i-menos"/></svg></button>
    <button id="zoom-reset" type="button" aria-label="Ver o mapa inteiro"><svg class="ic" aria-hidden="true"><use href="#i-inicio"/></svg></button>
  </div>

  <section id="cartao" aria-label="Faixa selecionada" hidden>
    <button id="cartao-fechar" type="button" aria-label="Fechar"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    <img id="cartao-capa" alt="" width="72" height="72" hidden>
    <div id="cartao-texto">
      <p id="cartao-genero"><span class="ponto"></span><span id="cartao-genero-nome"></span></p>
      <h2 id="cartao-titulo"></h2>
      <p id="cartao-artista"></p>
      <p id="cartao-album"></p>
    </div>
    <div id="cartao-acoes">
      <a id="cartao-ouvir" class="botao" href="./" aria-label="Ouvir no tocador">♪ no tocador</a>
      <button id="cartao-previa" class="botao botao-sec" type="button" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-tocar"/></svg><span>Prévia</span></button>
    </div>
    <div id="cartao-parecidos" hidden>
      <p>Soa parecido com</p>
      <div id="cartao-parecidos-lista"></div>
    </div>
    <audio id="previa" preload="none"></audio>
    <div id="cartao-progresso" hidden><span></span></div>
  </section>

  <p id="ajuda">arraste para navegar · role para zoom · botão direito (ou o botão girar) gira em 3D · clique numa faixa · M liga ou desliga a música · T faz o tour</p>

  <div id="carregando" role="status">
    <p>Atlas</p>
    <p id="carregando-status">Carregando o mapa…</p>
  </div>
</main>
</body>
</html>
