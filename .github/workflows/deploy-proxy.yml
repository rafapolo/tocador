name: Deploy Proxy

on:
  push:
    branches: [main]
    paths:
      - 'proxy.js'
      - 'package*.json'
      - 'Dockerfile'
      - 'haloy.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-proxy
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          cache: true

      - name: Install haloy
        run: bun add -g haloy@0.1.0-beta.39

      # gh secret set stores the value verbatim — unlike shell-sourcing .env,
      # it does not strip surrounding quotes. A value copied from a quoted
      # .env line (S3_ENDPOINT="https://...") ships the quote characters
      # straight into the container and breaks S3 auth/endpoint parsing.
      # Bit this repo three times on 2026-08-20 before being caught here.
      - name: Validate secrets aren't quote-wrapped
        run: |
          fail=0
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY S3_ENDPOINT S3_BUCKET; do
            value="${!name}"
            first="${value:0:1}"
            last="${value: -1}"
            if [ "$first" = '"' ] || [ "$last" = '"' ] || [ "$first" = "'" ] || [ "$last" = "'" ]; then
              echo "::error::$name is wrapped in quote characters — gh secret set doesn't strip them the way shell-sourcing .env does. Fix: gh secret set $name --body \"\$(grep '^$name=' .env | cut -d= -f2- | tr -d '\\\"')\""
              fail=1
            fi
          done
          exit $fail
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}

      - name: Deploy proxy to haloy
        run: haloy deploy
        env:
          HALOY_API_TOKEN: ${{ secrets.HALOY_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          # secrets named GITHUB_* are reserved, so secrets.GITHUB_TOKEN always
          # resolved to the ephemeral Actions token — revoked at job end, which
          # left /report-error baked with a dead credential in production.
          GITHUB_TOKEN: ${{ secrets.ISSUE_REPORT_TOKEN }}

      # /health can report 200 right after a fresh deploy even with dead S3
      # creds — its upstream-fail counter starts at zero until real traffic
      # hits S3. Only an actual object fetch proves the backend can serve
      # audio. (Caught a bad S3_ENDPOINT secret this way on 2026-08-20 that a
      # clean health check had missed.) Retried: the S3 connection pool is
      # cold for ~1-2 min right after a restart and can 503 briefly even when
      # everything is actually configured correctly.
      # Probes a matrix, not one URL. The single ASCII indie track this used to
      # check stayed green through the whole 2026-05→08 NFC outage: it has no
      # accents, and it is in the other bucket. A gate has to cover both buckets
      # AND both Unicode normalization forms, because sambaraiz/uqt stores keys
      # mostly decomposed (NFD, uploaded from macOS) and indie/indie mostly
      # composed (NFC). URLs below are percent-encoded exactly as ui.js's
      # encodeURI() emits them, so the probe sends what a real player sends.
      - name: Smoke test — real S3 fetch through the proxy
        run: |
          set -u
          rc=0
          probe() {
            label="$1"; url="$2"
            # Retried: the S3 connection pool is cold for ~1-2 min right after a
            # restart and can 503 briefly even when configured correctly.
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w "%{http_code}" -H "Range: bytes=0-1000" "$url")
              echo "  [$label] attempt $attempt: $code"
              if [ "$code" = "206" ] || [ "$code" = "200" ]; then return 0; fi
              [ "$attempt" = "6" ] || sleep 15
            done
            echo "::error::Smoke test failed — $label not serving: $url"
            rc=1
          }

          probe 'indie ASCII baseline' \
            'https://cdn.tocador.cc/indie/Aldan%20Voce%20Ja%20Roubou%20Hoje/aldan-voce-ja-roubou-hoje-2010.mp3'
          probe 'uqt accented, NFD-stored key' \
            'https://cdn.tocador.cc/uqt/1965%20-%20Forma65/03%20Canc%CC%A7a%CC%83o%20do%20Olhar%20Amado.mp3'
          probe 'uqt accented, NFC-stored dir' \
            'https://cdn.tocador.cc/uqt/1960%20-%20Elza%20Soares,%20Oswaldo%20Borba%20-%20Se%20Acaso%20Voc%C3%AA%20Chegasse/03%20Mulata%20Assanhada.mp3'

          [ "$rc" = "0" ] || exit 1
          echo "All probes served."
