name: Deploy Proxy

on:
  push:
    branches: [main]
    paths:
      - 'proxy.js'
      - 'package*.json'
      - 'Dockerfile'
      - 'haloy.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-proxy
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          cache: true

      - name: Install haloy
        run: bun add -g haloy@0.1.0-beta.39

      # gh secret set stores the value verbatim — unlike shell-sourcing .env,
      # it does not strip surrounding quotes. A value copied from a quoted
      # .env line (S3_ENDPOINT="https://...") ships the quote characters
      # straight into the container and breaks S3 auth/endpoint parsing.
      # Bit this repo three times on 2026-08-20 before being caught here.
      - name: Validate secrets aren't quote-wrapped
        run: |
          fail=0
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY S3_ENDPOINT S3_BUCKET; do
            value="${!name}"
            first="${value:0:1}"
            last="${value: -1}"
            if [ "$first" = '"' ] || [ "$last" = '"' ] || [ "$first" = "'" ] || [ "$last" = "'" ]; then
              echo "::error::$name is wrapped in quote characters — gh secret set doesn't strip them the way shell-sourcing .env does. Fix: gh secret set $name --body \"\$(grep '^$name=' .env | cut -d= -f2- | tr -d '\\\"')\""
              fail=1
            fi
          done
          exit $fail
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}

      - name: Deploy proxy to haloy
        run: haloy deploy
        env:
          HALOY_API_TOKEN: ${{ secrets.HALOY_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          # secrets named GITHUB_* are reserved, so secrets.GITHUB_TOKEN always
          # resolved to the ephemeral Actions token — revoked at job end, which
          # left /report-error baked with a dead credential in production.
          GITHUB_TOKEN: ${{ secrets.ISSUE_REPORT_TOKEN }}

      # /health can report 200 right after a fresh deploy even with dead S3
      # creds — its upstream-fail counter starts at zero until real traffic
      # hits S3. Only an actual object fetch proves the backend can serve
      # audio. (Caught a bad S3_ENDPOINT secret this way on 2026-08-20 that a
      # clean health check had missed.) Retried: the S3 connection pool is
      # cold for ~1-2 min right after a restart and can 503 briefly even when
      # everything is actually configured correctly.
      - name: Smoke test — real S3 fetch through the proxy
        run: |
          url="https://cdn.tocador.cc/indie/Aldan%20Voce%20Ja%20Roubou%20Hoje/aldan-voce-ja-roubou-hoje-2010.mp3"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Range: bytes=0-1000" "$url")
            echo "attempt $attempt: $code"
            [ "$code" = "206" ] || [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::Smoke test failed — proxy is not serving real audio after 6 attempts"
          exit 1
