name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'   # rebuilds album pages + sitemaps even when only the archive repos push
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Build static album pages and sitemaps
        # The player renders albums with JavaScript, so its ?acervo=&album= URLs all serve
        # the same "♪" shell: Google left every one of them unknown, and link previews
        # (which never run JS) showed no cover. script/build-album-pages.js turns each
        # catalog into a page per album at /<alias>/<slug>/ — the player itself with
        # that album's meta and markup baked in, and the URL the player keeps in the
        # address bar — an /<alias>/ index linking all of them, and the sitemaps listing those pages (sitemap.xml,
        # sitemap-albums-<alias>.xml). Built from the same catalogs the player loads
        # (KNOWN_ACERVOS in js/ui.js), fresh on every push and on the daily cron above.
        #
        # A catalog that can't be fetched fails the run on purpose: publishing without
        # it would 404 every album page and sitemap entry for that acervo, whereas a
        # failed run leaves the previous deployment live.
        run: |
          mkdir -p "$RUNNER_TEMP/catalogs"
          for pair in uqt=https://rafapolo.github.io/uqt/data/uqt-albums.json.gz \
                      homi=https://rafapolo.github.io/hominiscanidae/data/homi-albums.json.gz; do
            curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors "${pair#*=}" \
              -o "$RUNNER_TEMP/catalogs/${pair%%=*}.json.gz"
          done
          bun script/build-album-pages.js --out . \
            uqt="$RUNNER_TEMP/catalogs/uqt.json.gz" \
            homi="$RUNNER_TEMP/catalogs/homi.json.gz"

      - name: Minify JS and CSS
        # The player ships as plain source (no build step, and the uqt/hominiscanidae
        # mirrors copy it verbatim); only tocador.cc's deploy minifies, in place, on
        # the runner's checkout. ~35% fewer bytes over the wire, same file names, so
        # nothing that references them changes. The js/ files are classic scripts that
        # share globals, so this is a plain minify: esbuild leaves top-level names alone
        # outside a bundle/module. 3d.js is the one ES module.
        run: |
          for f in js/acervo-format.js js/util.js js/virtual-lists.js js/ui.js js/url-meta.js js/browse.js js/album-view.js js/playback.js js/radio.js; do
            bunx esbuild@0.25.10 "$f" --minify --allow-overwrite --outfile="$f" --log-level=warning
          done
          bunx esbuild@0.25.10 js/3d.js --minify --format=esm --allow-overwrite --outfile=js/3d.js --log-level=warning
          for f in assets/*.css; do
            bunx esbuild@0.25.10 "$f" --minify --allow-overwrite --outfile="$f" --log-level=warning
          done

      - name: Stamp the service-worker cache with this commit
        # A new CACHE name per deploy makes sw.js differ byte-wise, so browsers
        # install the new worker and it purges every older cache.
        run: sed -i "s/^const CACHE = '[^']*';/const CACHE = 'tocador-${GITHUB_SHA::8}';/" sw.js && grep -n "^const CACHE" sw.js

      - name: Version asset URLs
        # Pages serves everything with a 10-minute cache, so a browser without the
        # service worker (first visit, private window) could pair fresh HTML with
        # stale JS right after a deploy. ?v=<sha> on every local script/stylesheet
        # reference makes each deploy a new URL. The service worker keys by pathname
        # and is unaffected. Runs over every page, album pages included.
        run: |
          find . -name '*.html' -not -path './node_modules/*' -not -path './.git/*' -print0 \
            | xargs -0 sed -i -E "s#((src|href)=\"/?(js|assets)/[A-Za-z0-9_.-]+\.(js|css))\"#\1?v=${GITHUB_SHA::8}\"#g"
          grep -o 'src="[^"]*js/ui.js[^"]*"' index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - uses: actions/deploy-pages@v5
        id: deployment
